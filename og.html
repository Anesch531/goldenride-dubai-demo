<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family:'Bodoni Moda'; src:url('assets/fonts/bodoni-moda-latin.woff2') format('woff2'); font-weight:400 900; font-display:swap; }
  @font-face { font-family:'Archivo'; src:url('assets/fonts/archivo-latin.woff2') format('woff2'); font-weight:100 900; font-display:swap; }
  * { margin:0; box-sizing:border-box; }
  body { width:1200px; height:630px; background:#0B0A09; color:#EDE6D8; font-family:'Archivo',Arial,sans-serif;
         position:relative; overflow:hidden; }
  .frame { position:absolute; inset:34px; border:1px solid rgba(200,169,106,0.35); }
  .ticks { position:absolute; top:34px; left:34px; right:34px; height:1px; background:rgba(200,169,106,0.2); }
  .wrap { position:absolute; inset:34px; padding:64px 72px; display:flex; flex-direction:column; }
  .kick { color:#C8A96A; font-size:17px; letter-spacing:.34em; text-transform:uppercase; font-weight:600; }
  h1 { font-family:'Bodoni Moda',serif; font-weight:400; font-size:110px; line-height:1.0; margin-top:34px; letter-spacing:-0.01em; }
  h1 i { color:#E3CFA0; }
  .svc { margin-top:auto; display:flex; align-items:baseline; justify-content:space-between; gap:30px;
         border-top:1px solid rgba(200,169,106,0.22); padding-top:30px; }
  .svc span { color:#A39B8A; font-size:21px; letter-spacing:.16em; text-transform:uppercase; }
  .tag { color:rgba(200,169,106,0.75); font-size:15px; letter-spacing:.3em; text-transform:uppercase; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="wrap">
    <div class="kick">Umm Ramool &middot; Dubai</div>
    <h1>Golden Ride<br><i>Car Care</i></h1>
    <div class="svc">
      <span>PPF &middot; Ceramic &middot; Tinting &middot; Polishing</span>
      <div class="tag">Concept preview</div>
    </div>
  </div>
</body>
</html>
